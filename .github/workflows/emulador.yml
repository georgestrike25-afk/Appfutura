name: Emulador

# Pruebas en un emulador Android real: grabación con la pantalla apagada y en Doze
# (libre y siguiendo una ruta), persistencia con Room y capturas de todas las pantallas.
on:
  push:
    paths:
      - "app/**"
      - "core/**"
      - "scripts/emulador-gps.py"
      - ".github/workflows/emulador.yml"
  workflow_dispatch:

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compilar APK y pruebas instrumentadas
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Descargar mapa y relieve para las capturas
        continue-on-error: true
        run: |
          mkdir -p datos
          curl -fsSL -o datos/argentina.map https://github.com/${{ github.repository }}/releases/download/mapas-argentina/argentina.map
          curl -fsSL -o datos/relieve-cordoba.zip https://github.com/${{ github.repository }}/releases/download/mapas-argentina/relieve-cordoba.zip
          ls -la datos

      - name: Pruebas en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6000M
          ram-size: 3072M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/emulador-pruebas.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador-resultados
          path: |
            emulador/
          if-no-files-found: ignore

      - name: Publicar capturas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls emulador/capturas/*.png || { echo "No hay capturas"; exit 0; }
          cd emulador && zip -q -r capturas.zip capturas && cd ..
          gh release delete capturas-latest --yes --cleanup-tag || true
          gh release create capturas-latest emulador/capturas/*.png emulador/capturas.zip emulador/resultado.txt \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Cumbre – capturas del emulador" \
            --notes "Capturas reales de la app tomadas en un emulador Android 14 (Pixel 6) desde ${{ github.sha }}. La ruta es sintética («Ruta de prueba»)."
