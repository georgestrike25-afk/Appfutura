name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Compilar APK de depuración
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: cumbre-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes
          path: |
            core/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore

      - name: Publicar APK de prueba (enlace directo)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cumbre-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest cumbre-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Cumbre – versión de prueba" \
            --notes "APK de depuración generado automáticamente desde ${{ github.ref_name }} (${{ github.sha }}). Descargá cumbre-debug.apk desde el celular e instalalo."
